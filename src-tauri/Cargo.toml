[package]
name = "wuwatappo-macos"
version = "1.0.1"
description = "Wuwa Tappo (鸣潮桌宠) macOS port"
authors = ["port"]
edition = "2021"

[lib]
name = "wuwatappo_macos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "^2.10.3", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

[target."cfg(target_os = \"macos\")".dependencies]
# 全局键鼠监听（CGEventTap），选型与 ayangweb/BongoCat bongocat-platform 一致
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGEvent", "CGEventTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFMachPort", "CFRunLoop"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
